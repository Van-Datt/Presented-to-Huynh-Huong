<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tạm Biệt Hương</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/index.css">
</head>

<body>

<audio id="bgMusic">
    <source src="./img/naruto-main-theme_WWNB6pAx.mp3" type="audio/mpeg">
</audio>

<div id="intro">

    <div class="door left"></div>
    <div class="door right"></div>

    <button id="unlockBtn">
        Mở
    </button>

</div>


<div id="passwordModal">

    <div class="password-box">

        <h2>🌸 Đang Khóa 🌸</h2>

        <p>Nhập sai ăn bọp tay</p>

        <div class="password-input">

            <input
                type="password"
                id="doorPassword"
                placeholder="Mật khẩu"
            >

            <button id="togglePassword">
                👁
            </button>

        </div>

        <p id="passwordError"></p>

        <button id="confirmPassword">
            Mở Cửa
        </button>

    </div>

</div>


<div id="mainContent">

    <div class="container">

        <h1>🌸Tạm Biệt Huỳnh Hương 🌸</h1>

        <p>
            Có một món quà nhỏ đang chờ bà phía sau...
            <br>
            Từ Văn Đạt
        </p>

        <button id="startBtn">
            Bắt Đầu
        </button>

    </div>

</div>

<script src="js/index.js"></script>

</body>
</html>

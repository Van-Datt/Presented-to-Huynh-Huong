<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Một Món Quà Dành Cho Hương 🌸</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e8,#ffc1d9,#ffe6f1);
    font-family:'Quicksand',sans-serif;
}

.container{
    text-align:center;
    color:white;
    z-index:2;
}

h1{
    font-family:'Dancing Script',cursive;
    font-size:5rem;
    margin-bottom:20px;
    animation:fadeUp 1.5s ease;
}

p{
    font-size:1.2rem;
    margin-bottom:30px;
    animation:fadeUp 2s ease;
}

button{
    border:none;
    background:white;
    color:#ff4f95;
    padding:15px 40px;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

.flower{
    position:absolute;
    top:-20px;
    animation:fall linear forwards;
    pointer-events:none;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.fadeOut{
    animation:fadeOut 1s forwards;
}

@keyframes fadeOut{
    to{
        opacity:0;
    }
}

</style>
</head>
<body>

<audio id="bgMusic">
    <source src="NgayRoiChuyenBay.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <h1>Gửi Tặng Huỳnh Hương</h1>

    <p>
        Có một món quà nhỏ đang chờ bà phía sau...
        <br>
        Từ Văn Đạt 💗
    </p>

    <button id="startBtn">
        💖 Bắt Đầu
    </button>

</div>

<script>

function createFlower(){

    const flower=document.createElement("div");

    flower.className="flower";

    flower.innerHTML=Math.random()>0.5?"🌸":"💮";

    flower.style.left=Math.random()*100+"vw";

    flower.style.fontSize=(20+Math.random()*20)+"px";

    flower.style.animationDuration=
    (6+Math.random()*5)+"s";

    document.body.appendChild(flower);

    setTimeout(()=>{
        flower.remove();
    },12000);

}

setInterval(createFlower,300);

const btn=document.getElementById("startBtn");
const music=document.getElementById("bgMusic");

btn.onclick=()=>{

    music.play();

    document.body.classList.add("fadeOut");

    setTimeout(()=>{

        window.location.href="index.html";

    },1000);

};

</script>

</body>
</html>
